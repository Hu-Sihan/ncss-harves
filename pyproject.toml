[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ncss-harves"
version = "0.2.0"
description = "NCSS browser-authenticated local job query service"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "requests>=2.31",
  "websocket-client>=1.8",
  "tqdm>=4.66",
  "cryptography>=43",
  "keyring>=25",
  "pywin32>=306; platform_system == 'Windows'",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ncss-harves = "ncss_harves.cli.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["runtime", "pytest-cache-files-*"]
addopts = "-p no:cacheprovider"
